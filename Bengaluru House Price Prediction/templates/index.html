<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
    <title>House Price Predictor</title>
  </head>
  <body class="container mt-5">
    <h1 class="mb-4 text-center">🏠 House Price Predictor</h1>

    <form action="/predict" method="POST" class="card p-4 shadow">
      <div class="mb-3">
        <label class="form-label">Location</label>
        <input type="text" name="location" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Area (sqft)</label>
        <input type="number" name="sqft" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Bedrooms (BHK)</label>
        <input type="number" name="bhk" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Bathrooms</label>
        <input type="number" name="bath" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Predict Price</button>
    </form>

    {% if prediction %}
      <div class="alert alert-success mt-4 text-center">
        Predicted Price: {{ prediction }} INR
      </div>
    {% endif %}
  </body>
</html>
